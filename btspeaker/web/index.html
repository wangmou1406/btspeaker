<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0f0ee">
<meta name="color-scheme" content="light">
<meta name="description" content="蓝音管家 BTSpeaker —— iStoreOS 蓝牙音箱与自动化任务控制台">
<title>蓝音管家 BTSpeaker</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- 内联 SVG 图标库：全部图标为本地内联矢量，统一 16×16 线性描边，无任何外部资源 -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-logo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.2l4.3 3.2V6.3L7.2 9.5H4z"/><path d="M15 9a4.2 4.2 0 0 1 0 6"/><path d="M17.8 6.2a8 8 0 0 1 0 11.6"/></g></symbol>
  <symbol id="i-dashboard" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="4.5"/><rect x="14" y="11" width="7" height="10"/><rect x="3" y="13.5" width="7" height="7.5"/></g></symbol>
  <symbol id="i-devices" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></g></symbol>
  <symbol id="i-rules" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 14H10l-1 8 8.5-12H12l1-8z"/></g></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></g></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 14H10l-1 8 8.5-12H12l1-8z"/></g></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5.2v13.6L19 12 8.5 5.2z"/></g></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="6.5" width="11" height="11"/></g></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7.2a4.8 4.8 0 1 0 4.8 4.8"/><path d="m12 12 6.4-6.4"/><circle cx="12" cy="12" r="1.2"/></g></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.3l4.2 3.3V6.2L7.3 9.5H4z"/><path d="M15 9.4a3.8 3.8 0 0 1 0 5.2"/><path d="M17.6 6.8a7.4 7.4 0 0 1 0 10.4"/></g></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5 14.5 9.5"/><path d="M7.6 12.4 5.2 14.8a3.6 3.6 0 0 0 5 5l2.4-2.4"/><path d="M16.4 11.6l2.4-2.4a3.6 3.6 0 0 0-5-5l-2.4 2.4"/></g></symbol>
  <symbol id="i-link-off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5 12 12"/><path d="M7.6 12.4 5.2 14.8a3.6 3.6 0 0 0 5 5l2.4-2.4"/><path d="M16.4 11.6l2.4-2.4a3.6 3.6 0 0 0-5-5l-2.4 2.4"/><path d="M3 3l18 18"/></g></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.4 2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.8l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8L12 3.4z"/></g></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9.5 7V4.2h5V7"/><path d="M6.2 7l1 13h9.6l1-13"/><path d="M10 11v5.5M14 11v5.5"/></g></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19.2 8.8l-4-4L4 16v4z"/><path d="m13.6 6.4 4 4"/></g></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9.2 17 19.5 6.7"/></g></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></g></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></g></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></g></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9"/><path d="m7 13 5-5 5 5"/><path d="M4 4h16"/></g></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.6 2.1"/></g></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16"/><path d="m7 9.5 3 2.7-3 2.8"/><path d="M13 15.5h4"/></g></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18V6l10-2v11.5"/><circle cx="6.8" cy="18" r="2.7"/><circle cx="16.8" cy="15.5" r="2.7"/></g></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></g></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 2.8 20h18.4L12 3.2z"/><path d="M12 9.5v5"/><path d="M12 17.6v.01"/></g></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.2"/><path d="M12 7.9v.01"/></g></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="16" r="4"/><path d="M10.9 13.1 20 4"/><path d="M16.6 4H20v3.4"/></g></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="3" width="13" height="18"/><circle cx="12" cy="14.2" r="3.4"/><circle cx="12" cy="7.4" r="1.2"/></g></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 6 6 6-6 6"/></g></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></g></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g></symbol>
</svg>

<a class="skip-link" id="skip-link" href="#/dashboard">跳到主要内容</a>

<div class="app">
  <aside class="rail" aria-label="主导航">
    <a class="rail-brand" href="#/dashboard" aria-label="蓝音管家 BTSpeaker 首页">
      <span class="rail-brand-cn">蓝音管家</span>
      <span class="rail-brand-en">BTSPEAKER</span>
    </a>
    <div class="rail-rule" aria-hidden="true"></div>
    <nav class="rail-nav" aria-label="主菜单">
      <a class="rail-item" href="#/dashboard" data-nav="dashboard">
        <span class="rail-num">01</span><span class="rail-label">总览</span>
      </a>
      <a class="rail-item" href="#/devices" data-nav="devices">
        <span class="rail-num">02</span><span class="rail-label">音箱</span>
      </a>
      <a class="rail-item" href="#/rules" data-nav="rules">
        <span class="rail-num">03</span><span class="rail-label">自动化</span>
      </a>
      <a class="rail-item" href="#/settings" data-nav="settings">
        <span class="rail-num">04</span><span class="rail-label">设置</span>
      </a>
    </nav>
    <div class="rail-foot">
      <div class="rail-status" aria-live="polite">
        <span class="dot" id="side-dot"></span>
        <span class="rail-status-text" id="side-conn-text">连接中…</span>
      </div>
      <div class="rail-meta">
        <span class="mono" id="side-version">v—</span>
        <span class="tag tag--ghost" id="side-sim" hidden>模拟模式</span>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" type="button" data-act="open-token">
        <svg class="ic" aria-hidden="true"><use href="#i-key"></use></svg><span>访问令牌</span>
      </button>
    </div>
  </aside>

  <div class="stage">
    <header class="topbar">
      <a class="topbar-brand" href="#/dashboard" aria-label="蓝音管家 BTSpeaker 首页">
        <span class="topbar-brand-cn">蓝音管家</span>
        <span class="topbar-brand-en">BTSPEAKER</span>
      </a>
      <nav class="topbar-nav" aria-label="主菜单">
        <a class="topnav-item" href="#/dashboard" data-nav="dashboard">总览</a>
        <a class="topnav-item" href="#/devices" data-nav="devices">音箱</a>
        <a class="topnav-item" href="#/rules" data-nav="rules">自动化</a>
        <a class="topnav-item" href="#/settings" data-nav="settings">设置</a>
      </nav>
      <div class="topbar-side">
        <span class="conn-chip" aria-live="polite">
          <span class="dot" id="top-dot"></span>
          <span id="top-conn-text">连接中…</span>
        </span>
        <button class="btn btn-ghost btn-icon" type="button" data-act="open-token" aria-label="设置访问令牌" title="访问令牌">
          <svg class="ic" aria-hidden="true"><use href="#i-key"></use></svg>
        </button>
      </div>
    </header>

    <div class="banner" id="banner" role="alert" hidden>
      <span class="banner-kicker">SYSTEM / OFFLINE</span>
      <div class="banner-body">
        <strong id="banner-title">无法连接后端服务</strong>
        <span id="banner-text"></span>
      </div>
      <button class="btn btn-sm" type="button" data-act="retry">重试</button>
    </div>

    <main class="view" id="view" tabindex="-1"></main>

    <footer class="stage-foot">
      <span>蓝音管家 BTSpeaker · 蓝牙音箱与自动化控制台</span>
      <span class="mono" id="foot-version">v—</span>
    </footer>
  </div>
</div>

<nav class="tabbar" aria-label="底部导航">
  <a class="tab" href="#/dashboard" data-tab="dashboard">
    <span class="tab-num">01</span><span class="tab-label">总览</span>
  </a>
  <a class="tab" href="#/devices" data-tab="devices">
    <span class="tab-num">02</span><span class="tab-label">音箱</span>
  </a>
  <a class="tab" href="#/rules" data-tab="rules">
    <span class="tab-num">03</span><span class="tab-label">自动化</span>
  </a>
  <a class="tab" href="#/settings" data-tab="settings">
    <span class="tab-num">04</span><span class="tab-label">设置</span>
  </a>
</nav>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<noscript>
  <div class="noscript">蓝音管家需要启用 JavaScript 才能运行，请在浏览器设置中允许 JavaScript 后刷新页面。</div>
</noscript>

<script src="/app.js" defer></script>
</body>
</html>
